<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unit Converter</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100 min-h-screen">

    <main class="max-w-5xl mx-auto p-4">
        <h1 class="text-3xl font-bold text-slate-900">
            Unit Converter
        </h1>
        <p class="text-slate-500 mt-1">
            Convert between metric and imperial units.
        </p>

        <nav class="flex items-center gap-4 mt-6">
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                Weight
            </button>
            <button class="bg-white text-slate-700 px-4 py-2 rounded-lg">
                Distance
            </button>
            <button class="bg-white text-slate-700 px-4 py-2 rounded-lg">
                Temperature
            </button>
        </nav>

        <section class="bg-white rounded-2xl shadow-md p-6 mt-6">
            <h2 class="text-2xl font-bold text-slate-900">
                Weight Converter
            </h2>
            <p class="text-sm text-slate-500 mt-1">
                Convert between kilograms and pounds.
            </p>
            <div class="mt-5">
                <label for="weight-direction" class="block text-sm font-medium text-slate-700 mb-2">
                    Conversion Direction
                </label>
                <select id="weight-direction" class="w-full border border-slate-300 rounded-lg px-4 py-2">
                    <option value="kg-lb">Kilograms to Pounds</option>
                    <option value="lb-kg">Pounds to Kilograms</option>
                </select>
            </div>
            <div class="mt-5">
                <label for="weight-input" class="block text-sm font-medium text-slate-700 mb-2">
                    Value
                </label>
                <input id="weight-input" type="text" class="w-full border border-slate-300 rounded-lg px-4 py-2" placeholder="Enter  a value">
            </div>
            <button id="weight-convert" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg mt-5 hover:bg-blue-700 transition cursor-pointer">
                Convert
            </button>
            <div class="mt-5 bg-slate-100 rounded-lg p-4">
                <p class="text-sm text-slate-500">
                    Result
                </p>
                <p id="weight-result" class="text-2xl font-bold text-blue-600 mt-1">
                    --
                </p>
            </div>
        </section>
    </main>



    <script src="script.js"></script>
</body>
</html>
